# Production deploy used by CI/CD. Differs from dev compose in:
#   - pulls images from ECR instead of building locally
#   - uses real secrets from .env on the host (not committed)
#   - serves frontend as a built artifact via a tiny static server (or caddy)

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?Set POSTGRES_USER in .env}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE in .env.production}
    restart: always
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      APP_ENV: prod
    # Bring the schema up to date before serving (same as the dev compose).
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 6s
      start_period: 30s
      retries: 6

  worker:
    # Built from worker/Dockerfile: the backend image doesn't contain worker_app.
    image: ${WORKER_IMAGE:?Set WORKER_IMAGE in .env.production}
    restart: always
    env_file: .env
    environment:
      APP_ENV: prod
    depends_on:
      backend: { condition: service_healthy }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Run workspaces are temp dirs that the host's Docker bind-mounts into the
      # sandbox, so the path has to be the same inside and outside this container.
      - /tmp:/tmp
    command: ["python", "-m", "worker_app.worker"]
    deploy:
      replicas: 2

  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE in .env.production}
    restart: always
    expose: ["80"]

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "${CONCORD_HTTP_PORT:-80}:80"
      - "${CONCORD_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      CONCORD_DOMAIN: ${CONCORD_DOMAIN:-localhost}
    depends_on:
      backend: { condition: service_healthy }
      frontend: { condition: service_started }

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
