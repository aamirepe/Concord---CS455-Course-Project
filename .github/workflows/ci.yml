name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: concord
          POSTGRES_PASSWORD: concord
          POSTGRES_DB: concord_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U concord"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: mypy app
      - run: bandit -r app -ll
      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://concord:concord@localhost:5432/concord_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key-32-bytes-min
        run: |
          # 82.7% on CI when this floor was set (2026-09-26). The floor sits a few
          # points below as a regression guard, not a target.
          pytest --cov=app --cov-report=term-missing --cov-fail-under=78

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Build sandbox images
        run: |
          docker build -t concord-sandbox:latest ./sandbox
          docker build -t concord-sandbox-cpp:latest -f sandbox/Dockerfile.cpp ./sandbox
          docker build -t concord-sandbox-nodejs:latest -f sandbox/Dockerfile.nodejs ./sandbox
      - name: Run worker tests
        env:
          DOCKER_TESTS: "1"
          SECRET_KEY: ci-test-secret-key-32-bytes-min
          PYTHONPATH: backend
        run: |
          pytest worker/tests/ --import-mode=importlib -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Run tests
        run: npm run coverage
      - run: npm run build

  # The whole stack in Docker, as `scripts/pilot.sh up` runs it: the pilot's
  # API checks, then two real browsers (e2e/). No AI key, so the AI check skips.
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, worker, frontend]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Write .env with fresh secrets
        run: |
          cp .env.example .env
          sed -i "s/^SECRET_KEY=.*/SECRET_KEY=$(openssl rand -hex 32)/" .env
          sed -i "s/^LLM_ENCRYPTION_KEY=.*/LLM_ENCRYPTION_KEY=$(openssl rand -hex 32)/" .env
          sed -i "s/^MISTRAL_API_KEY=.*/MISTRAL_API_KEY=/" .env
      - name: Build
        run: docker compose build
      - name: Start
        run: |
          docker compose up -d postgres redis backend worker frontend
          for url in http://localhost:8000/healthz http://localhost:5173; do
            timeout 240 sh -c "until curl -fs -o /dev/null $url; do sleep 2; done"
          done
      - name: Seed demo accounts
        run: docker compose exec -T backend python /scripts/pilot.py seed
      - name: Pilot checks (API, WebSockets, sandbox, debugger, latency)
        run: docker compose exec -T backend python /scripts/pilot.py check
      - name: Browser tests
        run: |
          docker run --rm --network host --ipc=host -v "$PWD/e2e:/e2e" -w /e2e \
            mcr.microsoft.com/playwright/python:v1.60.0-noble \
            sh -c "pip install -q --break-system-packages -r requirements.txt && pytest -q -p no:cacheprovider"
      - name: Collect logs
        if: failure()
        run: |
          mkdir -p e2e/out
          for s in backend worker frontend; do docker compose logs --no-color $s > e2e/out/$s.log 2>&1; done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: e2e/out/
